<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RescuePulse | Create your account</title>
<link rel="stylesheet" href="/dashboard.css">
<script defer src="/auth.js">
</script>
</head>
<body>
<header>
<a class="brand" href="/">✚ <span>RescuePulse<small>EARLY INSIGHT. FASTER RESPONSE.</small>
</span>
</a>
<a href="/docs.html">Help center</a>
</header>
<main style="max-width:500px;padding-top:70px">
<span class="eyebrow">RESPONSE CENTER / ACCESS</span>
<h1>Create your account</h1>
<p class="muted">Your workspace for coordinated disaster response.</p>
<section class="panel" style="margin-top:28px">
<form id="auth-form" data-action="signup">
<label>Username<input name="username" autocomplete="username" pattern="[A-Za-z0-9_-]{3,40}" minlength="3" maxlength="40" required placeholder="Your username">
</label>
<label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="At least 8 characters">
</label>
<button class="primary" style="width:100%" type="submit">Create account</button>
<p id="auth-message" role="status" aria-live="polite" class="muted">
</p>
</form>
<p class="muted">
<a href="/sign-in.html">Already registered? Sign in →</a>
</p>
</section>
<p class="footnote">Keep your account details private. Contact your coordinator if you need different workspace permissions.</p>
</main>
</body>
</html>
